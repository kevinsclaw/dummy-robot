[tool.coverage.run]
branch = true
source = [ "ar4_sim_ar4_robot_agent" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/packages/ar4-robot-agent/ar4_robot_agent/html'
 --cov-report xml:'../../../coverage/packages/ar4-robot-agent/ar4_robot_agent/coverage.xml'
 --html='../../../reports/packages/ar4-robot-agent/ar4_robot_agent/unittests/html/index.html'
 --junitxml='../../../reports/packages/ar4-robot-agent/ar4_robot_agent/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "ar4_sim_ar4_robot_agent" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources."ar4_sim.agent_connection"]
workspace = true

[project]
name = "ar4_sim.ar4_robot_agent"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "ar4_sim.agent_connection",
  "aws-lambda-powertools==3.29.0",
  "aws-opentelemetry-distro==0.17.0",
  "bedrock-agentcore==1.9.1",
  "boto3==1.43.9",
  "fastapi==0.136.1",
  "mcp==1.27.1",
  "strands-agents==1.40.0",
  "strands-agents-tools==0.5.3",
  "uvicorn==0.47.0"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "fastapi[standard]==0.136.1" ]
