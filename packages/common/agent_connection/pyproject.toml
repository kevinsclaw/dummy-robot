[tool.coverage.run]
branch = true
source = [ "ar4_sim_agent_connection" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/packages/common/agent_connection/html'
 --cov-report xml:'../../../coverage/packages/common/agent_connection/coverage.xml'
 --html='../../../reports/packages/common/agent_connection/unittests/html/index.html'
 --junitxml='../../../reports/packages/common/agent_connection/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "ar4_sim_agent_connection" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "ar4_sim.agent_connection"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [ "aws-lambda-powertools==3.29.0" ]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
