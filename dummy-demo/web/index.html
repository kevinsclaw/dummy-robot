<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy V2 Controller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #0f3460;
        }
        header h1 { font-size: 1.4em; color: #4fc3f7; }
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        .status-dot.offline { background: #f44336; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .main { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; padding: 20px; }
        
        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #0f3460;
            border-radius: 12px;
            margin-bottom: 16px;
            min-height: 300px;
            max-height: 60vh;
        }
        .msg {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
        }
        .msg.user {
            background: #1565c0;
            margin-left: auto;
        }
        .msg.bot {
            background: #1b5e20;
        }
        .msg.thinking {
            background: #33333a;
            color: #aaa;
            font-style: italic;
        }
        .msg.error {
            background: #b71c1c;
        }
        .msg.tool {
            background: #1a237e;
            border-left: 3px solid #7c4dff;
            font-family: monospace;
            font-size: 0.9em;
        }
        .msg.status {
            background: #263238;
            font-family: monospace;
            font-size: 0.85em;
        }
        
        .input-area {
            display: flex;
            gap: 8px;
        }
        #cmd-input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 8px;
            background: #16213e;
            color: #eee;
            font-size: 1em;
            outline: none;
            border: 1px solid #0f3460;
        }
        #cmd-input:focus { border-color: #4fc3f7; }
        #cmd-input::placeholder { color: #666; }
        
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-send { background: #4fc3f7; color: #000; }
        .btn-home { background: #66bb6a; color: #000; }
        .btn-rehome { background: #4fc3f7; color: #000; }
        .btn-reset { background: #ffa726; color: #000; }
        .btn-estop { background: #f44336; color: #fff; font-size: 1.2em; }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .position-bar {
            display: flex;
            gap: 16px;
            padding: 10px 16px;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: monospace;
            font-size: 0.9em;
            flex-wrap: wrap;
        }
        .position-bar span { color: #4fc3f7; }

        .quick-cmds {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .quick-cmd {
            padding: 8px 14px;
            background: #1a237e;
            border: 1px solid #3949ab;
            border-radius: 20px;
            color: #9fa8da;
            font-size: 0.85em;
            cursor: pointer;
        }
        .quick-cmd:hover { background: #283593; color: #fff; }

        .safety-panel {
            background: #1b2838;
            border: 1px solid #37474f;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            font-size: 0.85em;
            line-height: 1.6;
        }
        .safety-panel h3 { color: #ffa726; margin-bottom: 8px; font-size: 1em; }
        .safety-panel .warn { color: #ef5350; font-weight: bold; }
        .safety-panel .step { color: #81c784; }
        .safety-panel .note { color: #90a4ae; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <div class="status-dot" id="status-dot"></div>
        <h1>🤖 Dummy V2 Controller</h1>
    </header>
    
    <div class="main">
        <div class="position-bar" id="pos-bar">
            X: <span id="pos-x">--</span> mm &nbsp;
            Y: <span id="pos-y">--</span> mm &nbsp;
            Z: <span id="pos-z">--</span> mm
        </div>

        <!-- 实时相机画面 -->
        <div style="text-align:center; margin: 10px 0;">
            <img id="camera-feed" src="/video_feed" style="width:100%; max-width:640px; border-radius:8px; border:1px solid #333;" 
                 onerror="this.style.display='none'" />
        </div>
        
        <div class="safety-panel">
            <h3>⚠️ 安全操作指南</h3>
            <p><span class="step">开机顺序：</span> 接电源 → 插 USB-C（翻面=STM32）→ 点「🏠 开机」(HOME + ENABLE)</p>
            <p><span class="step">关机顺序：</span> 点「📦 关机」(RESET折叠 + DISABLE) → 等 5秒到位 → 拔电源 → 拔 USB</p>
            <p class="warn">❌ 绝对不要在展开状态直接断电 — 机械臂会坠落！</p>
            <p class="note">USB Type-C 有正反面: 一面=STM32 CDC (✅), 翻面=ESP32 CP2102 (❌)</p>
        </div>

        <div class="quick-cmds">
            <div class="quick-cmd" onclick="sendQuick('移动到 x=200 y=0 z=250')">移动到正前方</div>
            <div class="quick-cmd" onclick="sendQuick('张开夹爪')">张开夹爪</div>
            <div class="quick-cmd" onclick="sendQuick('合拢夹爪')">合拢夹爪</div>
            <div class="quick-cmd" onclick="sendQuick('看看桌上有什么')">检测物体</div>
            <div class="quick-cmd" onclick="sendQuick('把红色方块放到蓝色旁边')">抓取任务</div>
        </div>
        
        <div class="chat-log" id="chat-log"></div>
        
        <div class="input-area">
            <input type="text" id="cmd-input" placeholder="输入指令... 例如: 移动到 x=200 y=100 z=250" 
                   onkeydown="if(event.key==='Enter')sendCmd()">
            <button class="btn-send" onclick="sendCmd()">发送</button>
        </div>
        
        <div class="controls">
            <button class="btn-home" onclick="sendHome()">🏠 开机 (HOME + ENABLE)</button>
            <button class="btn-rehome" onclick="sendRehome()">🔄 复位 (HOME)</button>
            <button class="btn-reset" onclick="sendReset()">📦 关机 (RESET + DISABLE)</button>
            <button class="btn-estop" onclick="sendEstop()">⛔ 急停</button>
        </div>
    </div>

    <script>
        let ws;
        const chatLog = document.getElementById('chat-log');
        
        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);
            
            ws.onopen = () => {
                document.getElementById('status-dot').classList.remove('offline');
                addMsg('系统已连接', 'status');
            };
            
            ws.onclose = () => {
                document.getElementById('status-dot').classList.add('offline');
                addMsg('连接断开，5秒后重连...', 'error');
                setTimeout(connect, 5000);
            };
            
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                switch(msg.type) {
                    case 'thinking':
                        addMsg(msg.text, 'thinking');
                        break;
                    case 'thinking_chunk':
                        appendToLast(msg.text, 'thinking');
                        break;
                    case 'tool_call':
                        addMsg(msg.text, 'tool');
                        break;
                    case 'response':
                        addMsg(msg.text, 'bot');
                        break;
                    case 'error':
                        addMsg(msg.text, 'error');
                        break;
                    case 'status':
                        if (msg.position) {
                            document.getElementById('pos-x').textContent = msg.position.x.toFixed(1);
                            document.getElementById('pos-y').textContent = msg.position.y.toFixed(1);
                            document.getElementById('pos-z').textContent = msg.position.z.toFixed(1);
                        }
                        break;
                }
            };
        }
        
        let lastMsgEl = null;
        
        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = `msg ${cls}`;
            div.textContent = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
            lastMsgEl = div;
        }
        
        function appendToLast(text, cls) {
            if (lastMsgEl && lastMsgEl.classList.contains(cls)) {
                lastMsgEl.textContent += text;
            } else {
                addMsg(text, cls);
            }
            chatLog.scrollTop = chatLog.scrollHeight;
        }
        
        function sendCmd() {
            const input = document.getElementById('cmd-input');
            const text = input.value.trim();
            if (!text || !ws) return;
            
            addMsg(text, 'user');
            ws.send(JSON.stringify({type: 'command', text: text}));
            input.value = '';
        }
        
        function sendQuick(text) {
            addMsg(text, 'user');
            ws.send(JSON.stringify({type: 'command', text: text}));
        }
        
        function sendHome() {
            addMsg('🏠 开机: HOME + ENABLE...', 'user');
            ws.send(JSON.stringify({type: 'home'}));
        }
        
        function sendRehome() {
            addMsg('🔄 复位: HOME...', 'user');
            ws.send(JSON.stringify({type: 'rehome'}));
        }
        
        function sendReset() {
            if (!confirm('ℹ️ 关机流程：\n1. RESET (折叠收纳)\n2. DISABLE (失能电机)\n\n确认关机？')) return;
            addMsg('📦 关机: RESET + DISABLE...', 'user');
            ws.send(JSON.stringify({type: 'reset'}));
        }
        
        function sendEstop() {
            addMsg('⛔ 急停！', 'user');
            ws.send(JSON.stringify({type: 'estop'}));
        }
        
        // Init
        connect();
        
        // Fetch initial status
        fetch('/status').then(r => r.json()).then(data => {
            if (data.position) {
                document.getElementById('pos-x').textContent = data.position.x.toFixed(1);
                document.getElementById('pos-y').textContent = data.position.y.toFixed(1);
                document.getElementById('pos-z').textContent = data.position.z.toFixed(1);
            }
        });
    </script>
</body>
</html>
